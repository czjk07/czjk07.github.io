<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informatics Practice Tests</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="app-title">Informatics Practice</h1>
    <button id="home-btn" class="btn btn-ghost hidden">&#8592; Home</button>
  </header>

  <main id="app">
    <!-- Home view -->
    <section id="view-home" class="view">
      <p class="subtitle">Z&aacute;klady informatiky &ndash; 176 questions</p>
      <div class="menu">
        <button id="btn-test" class="menu-card">
          <span class="menu-card-title">Test &ndash; 20 questions</span>
          <span class="menu-card-desc">Generate a set of 20 random questions. Answers are checked instantly with an explanation.</span>
        </button>
        <button id="btn-flash" class="menu-card">
          <span class="menu-card-title">Practice one by one</span>
          <span class="menu-card-desc">Flashcard mode: one question at a time in the center of the screen.</span>
        </button>
      </div>
    </section>

    <!-- Test view -->
    <section id="view-test" class="view hidden">
      <div class="toolbar">
        <div class="score" id="test-score">Answered: 0/20 &middot; Correct: 0</div>
        <button id="btn-new-test" class="btn">New test</button>
      </div>
      <div id="test-questions"></div>
    </section>

    <!-- Flashcard view -->
    <section id="view-flash" class="view hidden">
      <div class="flash-wrap">
        <div class="score" id="flash-score">Correct: 0/0</div>
        <div class="flash-card" id="flash-card">
          <div class="q-meta" id="flash-meta"></div>
          <h2 class="q-text" id="flash-q"></h2>
          <div class="options" id="flash-options"></div>
          <div class="explanation hidden" id="flash-expl"></div>
          <button id="btn-next" class="btn btn-primary hidden">Next question</button>
        </div>
      </div>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
